name: liveworld-map
services:
  liveworld-map:
    # Builds locally from the Dockerfile so you always run the cloned code.
    # To use the prebuilt image instead, replace the `build:` block below with
    build:
      context: .
      dockerfile: Dockerfile
    container_name: liveworld-map
    # LIVEWORLD_PORT takes precedence; OSIRIS_PORT remains supported for existing deployments.
    ports:
      - "${LIVEWORLD_PORT:-${OSIRIS_PORT:-3000}}:3000"
    # Optional API keys / scanner backend — copy .env.template to .env and
    # fill in what you need. Missing file is ignored (keyless feeds still work).
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - default
      - umami_default

  liveworld-map-cache:
    image: nginx:alpine
    container_name: liveworld-map-cache
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-cache:/var/cache/nginx
    depends_on:
      - liveworld-map
    restart: unless-stopped
    networks:
      - default

  liveworld-map-intel:
    build:
      context: ./intel
      dockerfile: Dockerfile
    container_name: liveworld-map-intel
    ports:
      - "4000:4000"
    restart: unless-stopped
    networks:
      - default

volumes:
  nginx-cache:

networks:
  umami_default:
    external: true

# ── CasaOS app-store metadata (ignored by plain Docker Compose) ──
x-casaos:
  architectures:
    - amd64
    - arm64
  main: liveworld-map
  author: fcflo151
  developer: fcflo151
  category: Network
  description:
    en_us: >-
      LiveWorld Map is a production-grade open-source intelligence and civil-
      protection dashboard. It extends the original OSIRIS foundation by
      simplifaisoul with rail, waterways, energy, and civil-protection layers.
      Most features work with no API keys.
  tagline:
    en_us: Real-time global intelligence and civil-protection map
  title:
    en_us: LiveWorld Map
  icon: https://raw.githubusercontent.com/fcflo151/liveworld-map/main/public/casaos-icon.png
  thumbnail: https://raw.githubusercontent.com/fcflo151/liveworld-map/main/public/og-image.png
  screenshot_link:
    - https://raw.githubusercontent.com/fcflo151/liveworld-map/main/public/og-image.png
  scheme: http
  hostname: ""
  port_map: "3000"
  index: /
  webui_port: 3000
  envs:
    - container: SCANNER_URL
      description:
        en_us: "(Optional) RECON scanner backend URL, e.g. http://scanner:7700"
    - container: SCANNER_KEY
      description:
        en_us: "(Optional) RECON scanner shared secret (must match backend OSIRIS_KEY)."
    - container: FIRMS_API_KEY
      description:
        en_us: "(Optional) NASA FIRMS API key for active-fire data."
    - container: AIS_API_KEY
      description:
        en_us: "(Optional) aisstream.io key for maritime vessel tracking."
    - container: OPENSKY_CLIENT_ID
      description:
        en_us: "(Optional) OpenSky OAuth2 client id for higher aircraft rate limits."
    - container: OPENSKY_CLIENT_SECRET
      description:
        en_us: "(Optional) OpenSky OAuth2 client secret."
    - container: N2YO_API_KEY
      description:
        en_us: "(Optional) N2YO key for satellite tracking."
    - container: ENTSOE_API_TOKEN
      description:
        en_us: "(Optional) ENTSO-E Web API token for European power flows and generation outages."
    - container: ICAO_API_KEY
      description:
        en_us: "(Optional) ICAO API Data Service key for operational NOTAM alerts."
    - container: OSIRIS_NOTAM_LOCATIONS
      description:
        en_us: "(Optional) Up to 10 comma-separated ICAO FIR or aerodrome codes for NOTAM monitoring."
  ports:
    - container: "3000"
      description:
        en_us: "Web UI (HTTP)."
