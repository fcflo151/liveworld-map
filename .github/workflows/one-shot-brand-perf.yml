name: One-shot LiveWorldMap startup patch

on:
  push:
    paths:
      - '.github/workflows/one-shot-brand-perf.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch startup, branding, and lazy loading
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read_preserve(path: str):
              with open(path, 'r', encoding='utf-8', newline='') as f:
                  return f.read()

          def write_preserve(path: str, text: str):
              with open(path, 'w', encoding='utf-8', newline='') as f:
                  f.write(text)

          def replace_once(text: str, old: str, new: str, label: str):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, got {count}')
              return text.replace(old, new, 1)

          page_path = 'src/app/page.tsx'
          page = read_preserve(page_path)
          nl = '\r\n' if '\r\n' in page else '\n'

          # Keep the very large, closed-by-default tools out of the initial JS bundle.
          page = replace_once(page, "import WorldRemote from '@/components/WorldRemote';" + nl, '', 'WorldRemote import')
          page = replace_once(page, "import ArcGISPanel from '@/components/ArcGISPanel';" + nl, '', 'ArcGIS import')
          dynamic_anchor = "const LiveWorldMap = dynamic(() => import('@/components/LiveWorldMap'), { ssr: false });"
          dynamic_replacement = dynamic_anchor + nl + \
              "const WorldRemote = dynamic(() => import('@/components/WorldRemote'), { ssr: false });" + nl + \
              "const ArcGISPanel = dynamic(() => import('@/components/ArcGISPanel'), { ssr: false });"
          page = replace_once(page, dynamic_anchor, dynamic_replacement, 'dynamic panel anchor')

          # Explicit boot phases: map first, core feeds next, heavier active layers last.
          state_old = "  const [showSplash, setShowSplash] = useState(true);" + nl + "  const autoLocateCancelled = useRef(false);"
          state_new = (
              "  const [showSplash, setShowSplash] = useState(true);" + nl +
              "  const [mapBootReady, setMapBootReady] = useState(false);" + nl +
              "  const [dataBootReady, setDataBootReady] = useState(false);" + nl +
              "  const [layerBootReady, setLayerBootReady] = useState(false);" + nl +
              "  const splashStartedAt = useRef(Date.now());" + nl +
              "  const handleMapReady = useCallback(() => setMapBootReady(true), []);" + nl +
              "  const autoLocateCancelled = useRef(false);"
          )
          page = replace_once(page, state_old, state_new, 'boot state')

          splash_old = nl.join([
              "  // Splash screen",
              "  useEffect(() => {",
              "    const splashTimer = setTimeout(() => setShowSplash(false), 2500);",
              "    return () => clearTimeout(splashTimer);",
              "  }, []);",
          ])
          splash_new = nl.join([
              "  // Startup sequencing: let MapLibre establish the base map before network-heavy feeds.",
              "  useEffect(() => {",
              "    if (!mapBootReady) return;",
              "    const coreTimer = setTimeout(() => setDataBootReady(true), 250);",
              "    const layerTimer = setTimeout(() => setLayerBootReady(true), 1800);",
              "    return () => {",
              "      clearTimeout(coreTimer);",
              "      clearTimeout(layerTimer);",
              "    };",
              "  }, [mapBootReady]);",
              "",
              "  // Keep the intro visible long enough to mask startup work, but never trap the UI.",
              "  useEffect(() => {",
              "    const fallbackTimer = setTimeout(() => setShowSplash(false), 9000);",
              "    if (!mapBootReady) return () => clearTimeout(fallbackTimer);",
              "    const elapsed = Date.now() - splashStartedAt.current;",
              "    const readyTimer = setTimeout(() => setShowSplash(false), Math.max(0, 5200 - elapsed));",
              "    return () => {",
              "      clearTimeout(fallbackTimer);",
              "      clearTimeout(readyTimer);",
              "    };",
              "  }, [mapBootReady]);",
          ])
          page = replace_once(page, splash_old, splash_new, 'splash sequencing')

          # Gate core feed loading until the map reports ready, then stagger the first requests.
          core_marker = "  // ── PROGRESSIVE DATA LOADING (request-optimized) ──" + nl + "  useEffect(() => {" + nl
          page = replace_once(page, core_marker, core_marker + "    if (!dataBootReady) return;" + nl, 'core boot guard')
          page = replace_once(page, "    fetchEndpoint(eqUrl, eqTransform);", "    const eqTimer = setTimeout(() => { void fetchEndpoint(eqUrl, eqTransform); }, 0);", 'earthquake startup timer')
          page = replace_once(page, "    fetchEndpoint('/api/news');", "    const newsTimer = setTimeout(() => { void fetchEndpoint('/api/news'); }, 600);", 'news startup timer')
          page = replace_once(page, "    const marketTimer = setTimeout(() => loadMarkets(), 800);", "    const marketTimer = setTimeout(() => loadMarkets(), 1200);", 'market startup timer')
          cleanup_old = "    return () => {" + nl + "      clearTimeout(marketTimer);"
          cleanup_new = "    return () => {" + nl + "      clearTimeout(eqTimer);" + nl + "      clearTimeout(newsTimer);" + nl + "      clearTimeout(marketTimer);"
          # Only touch the cleanup inside the progressive loader.
          core_start = page.index("  // ── PROGRESSIVE DATA LOADING (request-optimized) ──")
          cleanup_at = page.index(cleanup_old, core_start)
          page = page[:cleanup_at] + cleanup_new + page[cleanup_at + len(cleanup_old):]
          core_dep = "  }, [fetchEndpoint]);"
          core_dep_at = page.index(core_dep, core_start)
          page = page[:core_dep_at] + "  }, [fetchEndpoint, dataBootReady]);" + page[core_dep_at + len(core_dep):]

          # Camera catalogue and the rest of the default active layers wait until the second phase.
          page = replace_once(page, "    if (!activeLayers.cctv) return;", "    if (!layerBootReady || !activeLayers.cctv) return;", 'camera boot guard')
          page = replace_once(page, "  }, [activeLayers.cctv]);", "  }, [activeLayers.cctv, layerBootReady]);", 'camera boot dependency')
          layer_marker = "  // ── LAYER-AWARE DATA LOADING — only fetch when layer is toggled ON ──"
          layer_start = page.index(layer_marker)
          effect_anchor = "  useEffect(() => {" + nl + nl + "    // Flights"
          effect_at = page.index(effect_anchor, layer_start)
          effect_new = "  useEffect(() => {" + nl + "    if (!layerBootReady) return;" + nl + nl + "    // Flights"
          page = page[:effect_at] + effect_new + page[effect_at + len(effect_anchor):]
          layer_dep = "  }, [activeLayers]);"
          layer_dep_at = page.index(layer_dep, effect_at)
          page = page[:layer_dep_at] + "  }, [activeLayers, layerBootReady]);" + page[layer_dep_at + len(layer_dep):]

          # Defer the non-visual global stats request as well.
          stats_marker = "  // Global Stats Fetch" + nl + "  useEffect(() => {" + nl
          page = replace_once(page, stats_marker, stats_marker + "    if (!dataBootReady) return;" + nl, 'stats boot guard')
          stats_start = page.index("  // Global Stats Fetch")
          stats_dep = "  }, []);"
          stats_dep_at = page.index(stats_dep, stats_start)
          page = page[:stats_dep_at] + "  }, [dataBootReady]);" + page[stats_dep_at + len(stats_dep):]

          # Branding: exact product name is LiveWorldMap (no space), and keep it inside narrow phone widths.
          branding_count = page.count('LIVEWORLD MAP')
          if branding_count < 2:
              raise SystemExit(f'branding: expected at least 2 LIVEWORLD MAP occurrences, got {branding_count}')
          page = page.replace('LIVEWORLD MAP', 'LIVEWORLDMAP')
          page = replace_once(page,
              '            <div className="flex items-center gap-[2px] mb-3 z-[2]">',
              '            <div className="flex items-center justify-center gap-0 mb-3 z-[2] max-w-[92vw] whitespace-nowrap">',
              'splash title wrapper')
          page = replace_once(page,
              '                  className="text-4xl md:text-5xl font-bold tracking-[0.5em] font-mono"',
              '                  className="text-2xl sm:text-3xl md:text-5xl font-bold tracking-[0.18em] sm:tracking-[0.28em] md:tracking-[0.45em] font-mono"',
              'splash title sizing')
          page = replace_once(page,
              "                  transition={{ duration: 2.2, delay: 0.5, times: [0, 0.25, 0.5, 0.75, 1], ease: 'easeInOut' }}",
              "                  transition={{ duration: 4.4, delay: 0.5, times: [0, 0.25, 0.5, 0.75, 1], ease: 'easeInOut' }}",
              'splash progress duration')
          page = replace_once(page, "                  { text: 'ESTABLISHING SECURE CONNECTION...', delay: 0.5 },", "                  { text: 'LOADING BASE MAP...', delay: 0.5 },", 'splash stage 1')
          page = replace_once(page, "                  { text: 'INITIALIZING FEEDS...', delay: 1.1 },", "                  { text: 'INITIALIZING CORE FEEDS...', delay: 1.8 },", 'splash stage 2')
          page = replace_once(page, "                  { text: 'CALIBRATING SENSORS...', delay: 1.7 },", "                  { text: 'SYNCING ACTIVE LAYERS...', delay: 3.1 },", 'splash stage 3')
          page = replace_once(page, "                  { text: 'SYSTEM READY', delay: 2.2 },", "                  { text: 'SYSTEM READY', delay: 4.5 },", 'splash stage 4')

          # Remove the legacy eye mark from the top HUD and reclaim its horizontal padding.
          eye_pattern = r'\s*<svg viewBox="0 0 650 500" className="w-8 h-8 md:w-10 md:h-10[^>]*>[\s\S]*?</svg>'
          page, eye_count = re.subn(eye_pattern, '', page, count=1)
          if eye_count != 1:
              raise SystemExit(f'legacy eye: expected 1 match, got {eye_count}')
          page = replace_once(page, 'mt-1.5 pl-[44px] min-w-0 pr-4', 'mt-1.5 pl-0 min-w-0 pr-4', 'header padding')

          # Tell the page when MapLibre has finished its initial style/layer setup.
          map_prop_anchor = "          onMapCenter={setMapCenter}" + nl
          page = replace_once(page, map_prop_anchor, map_prop_anchor + "          onMapReady={handleMapReady}" + nl, 'map ready prop')

          write_preserve(page_path, page)

          map_path = 'src/components/LiveWorldMap.tsx'
          world = read_preserve(map_path)
          wnl = '\r\n' if '\r\n' in world else '\n'
          world = replace_once(world,
              "  onTerrainStatusChange?: (status: TerrainStatus) => void;" + wnl,
              "  onTerrainStatusChange?: (status: TerrainStatus) => void;" + wnl + "  onMapReady?: () => void;" + wnl,
              'LiveWorldMap onMapReady prop')
          world = replace_once(world,
              "onTerrainStatusChange, mapStyle = 'dark'",
              "onTerrainStatusChange, onMapReady, mapStyle = 'dark'",
              'LiveWorldMap onMapReady argument')
          world = replace_once(world,
              "      setMapReady(true);" + wnl,
              "      setMapReady(true);" + wnl + "      onMapReady?.();" + wnl,
              'LiveWorldMap ready callback')
          write_preserve(map_path, world)

          print('Patched startup sequencing, branding, responsive splash title, and legacy header mark.')
          PY

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Commit final patch and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/one-shot-brand-perf.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx src/components/LiveWorldMap.tsx .github/workflows/one-shot-brand-perf.yml
          git commit -m "perf: stage startup and refresh LiveWorldMap branding"
          git push origin HEAD:master
