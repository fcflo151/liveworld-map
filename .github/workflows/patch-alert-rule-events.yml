name: Apply alert rule event fix

on:
  push:
    branches:
      - operator/mission-workspace
    paths:
      - .github/workflows/patch-alert-rule-events.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: operator/mission-workspace
          fetch-depth: 0

      - name: Patch rule-only AOI transition events
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/app/page.tsx')
          raw = path.read_bytes()
          newline = b'\r\n' if b'\r\n' in raw else b'\n'

          def block(value: str) -> bytes:
              return value.replace('\n', newline.decode()).encode()

          replacements = [
              (
                  block("""    const freshEvents: WatchEvent[] = [];
    const reportsMap: Record<string, AoiReport> = {};
"""),
                  block("""    const freshEvents: WatchEvent[] = [];
    const ruleEvents: WatchEvent[] = [];
    const reportsMap: Record<string, AoiReport> = {};
"""),
              ),
              (
                  block("""      if (isWatched) {
        freshEvents.push(...events);
      }
"""),
                  block("""      if (hasRule) {
        ruleEvents.push(...events);
      }
      if (isWatched) {
        freshEvents.push(...events);
      }
"""),
              ),
              (
                  block("""        reportsMap,
        freshEvents,
        alertEvalStateRef.current,
"""),
                  block("""        reportsMap,
        ruleEvents,
        alertEvalStateRef.current,
"""),
              ),
          ]

          for old, new in replacements:
              count = raw.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}')
              raw = raw.replace(old, new, 1)

          path.write_bytes(raw)
          PY

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/patch-alert-rule-events.yml
          git config user.name "Flo"
          git config user.email "bleesenf@gmail.com"
          git add src/app/page.tsx .github/workflows/patch-alert-rule-events.yml
          git commit -m "fix: evaluate transition alerts for rule-only AOIs"
          git push origin HEAD:operator/mission-workspace
