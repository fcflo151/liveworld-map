name: Apply mission workspace wiring

# Replay after preserving the source file line endings.
on:
  push:
    branches: ["operator/mission-workspace"]
    paths: [".github/workflows/mission-workspace-patch.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: operator/mission-workspace
          fetch-depth: 0
      - name: Apply patch
        run: python tools/mission_workspace_patch.py
      - name: Validate diff
        run: git diff --check
      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx src/app/api/conflicts/route.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat: wire mission workspace into desktop and mobile"
          git push origin HEAD:operator/mission-workspace
